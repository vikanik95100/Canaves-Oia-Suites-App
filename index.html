<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--ink:#14233F;--bg:#F8F6F1;--sand:#9FC2E2;--gold:#2B5E94;--lsand:#BFD6EC;--paper:#FFFFFF;--warm:#C2417A;--ice:#7BB8CF;--mut:rgba(20,35,63,.6);--line:rgba(43,94,148,.2);--c:"Poppins",system-ui,sans-serif;--f:"Playfair Display",Georgia,serif;--s:1}
html,body{height:100%}
body{font-variant-numeric:lining-nums;font-family:var(--c);background:#DDE5EE;color:var(--ink);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}

.sheet{position:absolute;left:0;right:0;bottom:0;z-index:55;border-radius:30px 30px 0 0;padding:10px 20px 32px;transform:translateY(105%);transition:transform .6s cubic-bezier(.2,.85,.25,1);background:var(--paper);box-shadow:0 -24px 50px rgba(10,22,44,.45);color:var(--ink);max-height:92%;overflow-y:auto;scrollbar-width:none}

.msg{max-width:84%;padding:11px 16px;border-radius:20px;font-size:15.5px;line-height:1.45;animation:up .5s both}

.typing{display:flex;gap:4px;padding:15px 16px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink);opacity:.4;animation:bl 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.2}30%{opacity:.9}}
.toast{position:absolute;left:50%;bottom:116px;transform:translate(-50%,20px);z-index:80;padding:12px 20px;border-radius:99px;font-size:14.5px;font-weight:600;opacity:0;transition:all .4s cubic-bezier(.2,.8,.2,1);white-space:nowrap;background:var(--ink);color:#fff;box-shadow:0 0 0 1.5px var(--sand)}

.keybtn{position:relative;width:112px;height:112px;border-radius:50%;background:linear-gradient(135deg,#cfe2f4,#9FC2E2 55%,#5f93c4);color:var(--ink);display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .2s,background .3s;flex:none;box-shadow:0 10px 24px -8px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.3)}
.keybtn:active{transform:scale(.95)}.keybtn.ok{background:#2f9e6c;color:#fff}

.keybtn .rp{position:absolute;inset:0;border-radius:50%;border:2px solid #fff;opacity:0}.keybtn.ok .rp{animation:rip 1.2s infinite}

.seg{display:flex;background:#E8EEF5;border-radius:99px;padding:4px;gap:2px}.seg button{flex:1;text-align:center;padding:9px 6px;border-radius:99px;font-weight:700;font-size:13.5px;transition:all .2s;color:var(--mut)}.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
